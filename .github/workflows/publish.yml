name: Publish source-checked injury board
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-injury-board
  cancel-in-progress: true
jobs:
  unblock-stale-deployments:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Close stale github-pages deployments that block the queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/unblock_deployments.py
  publish:
    needs: unblock-stale-deployments
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source ledger and collector
        run: python -m unittest discover -s tests -v
      - name: Check browser logic
        run: node --test tests/ui.test.mjs
      - name: Refresh scores and official game reports (degrade visibly on outage)
        run: python scripts/refresh.py --live /tmp/injury-live.json --scoreboard /tmp/injury-scores.json
      - name: Assemble static Pages artifact
        run: python scripts/build.py --output _site --live /tmp/injury-live.json --scoreboard /tmp/injury-scores.json
      - name: Wait for legacy Pages build on main pushes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/wait_for_legacy_pages.py --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
