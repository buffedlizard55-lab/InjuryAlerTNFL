name: Verify sources and site
on:
  pull_request:
    branches: [main]
  push:
    branches: [arena/01a0d02e-injuryalertnfl]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the source ledger and fail-closed collector
        run: python -m unittest discover -s tests -v
      - name: Check browser presentation rules
        run: node --test tests/ui.test.mjs
      - name: Re-check each linked excerpt online (report outages, never claim success)
        continue-on-error: true
        shell: bash
        run: |
          if python scripts/verify_sources.py --strict > /tmp/source-audit.txt 2>&1; then
            cat /tmp/source-audit.txt
            echo "::notice title=Online source audit::$(head -n 1 /tmp/source-audit.txt)"
            result=0
          else
            cat /tmp/source-audit.txt
            echo "::warning title=Online source audit::$(head -n 1 /tmp/source-audit.txt)"
            for line in $(grep "REVIEW:" /tmp/source-audit.txt | head -5); do
              echo "::warning title=Online source audit detail::$line"
            done
            result=1
          fi
          {
            echo '## Online source audit'
            echo '```'
            cat /tmp/source-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Show served text around any ungrounded excerpt (diagnostic)
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, "scripts")
          from verify_sources import source_text
          for url in re.findall(r"excerpt not found at (\S+)", open("/tmp/source-audit.txt").read()):
              try:
                  text = source_text(url)
              except Exception as exc:
                  print(f"{url}: unavailable ({exc})")
                  continue
              print(f"{url}: fetched {len(text)} normalized chars")
              for probe in ("harbaugh confirmed", "season-ending surgery"):
                  i = text.find(probe)
                  if i >= 0:
                      print(f"  ~{probe!r}: ...{text[max(0, i-140):i+260]}...")
                  else:
                      print(f"  ~{probe!r}: not present in served text")
          PY
      - name: Assemble Pages without remote data
        run: python scripts/build.py --output _site
