name: Verify sources and site
on:
  pull_request:
    branches: [main]
  push:
    branches: [arena/01a0cfe2-injuryalertnfl]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the source ledger and fail-closed collector
        run: python -m unittest discover -s tests -v
      - name: Check browser presentation rules
        run: node --test tests/ui.test.mjs
      - name: Re-check each linked excerpt online (report outages, never claim success)
        continue-on-error: true
        run: python scripts/verify_sources.py --strict
      - name: Assemble Pages without remote data
        run: python scripts/build.py --output _site
