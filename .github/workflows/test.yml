name: Verify sources and site
on:
  pull_request:
    branches: [main]
  # Any session branch, so a push that adds incidents is verified before a PR
  # exists. (This used to name one previous arena branch, which meant pushes to
  # the current one went unchecked.)
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the source ledger and fail-closed collector
        run: python -m unittest discover -s tests -v
      - name: Check browser presentation rules
        run: node --test tests/ui.test.mjs
      - name: Re-check each linked excerpt online (report outages, never claim success)
        continue-on-error: true
        shell: bash
        run: |
          if python scripts/verify_sources.py --strict > /tmp/source-audit.txt 2>&1; then
            cat /tmp/source-audit.txt
            echo "::notice title=Online source audit::$(head -n 1 /tmp/source-audit.txt)"
            result=0
          else
            cat /tmp/source-audit.txt
            echo "::warning title=Online source audit::$(head -n 1 /tmp/source-audit.txt)"
            # One annotation per drifted claim, so a reviewer sees the whole list in
            # the Checks UI instead of only the first three lines.
            grep "REVIEW:" /tmp/source-audit.txt | head -50 | while IFS= read -r line; do
              echo "::warning file=data/archive.json,title=Excerpt drift::${line#REVIEW: }"
            done
            DIAG="$(python scripts/diagnose_audit.py --audit /tmp/source-audit.txt | head -8)"
            echo "$DIAG"
            echo "::warning title=Audit diagnostic::${DIAG//[$'\n\r']/%0A}"
            result=1
          fi
          {
            echo '## Online source audit'
            echo '```'
            cat /tmp/source-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Self-audit the published artefacts against the stated rules
        run: python scripts/selfcheck.py
      - name: Assemble Pages without remote data
        run: python scripts/build.py --output _site
